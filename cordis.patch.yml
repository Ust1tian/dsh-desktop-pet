# desktop-pet bundle layer.
#
# Applied when a profile lists this bundle (see `dsh.profile.bundles`).
# The pet is optional: omitting or removing this bundle leaves Harness
# functioning normally.
- insert:
    - id: desktop-pet
      name: dsh-desktop-pet
      config:
        enabled: true
        alwaysOnTop: true
        petScale: 1
        petId: deepseek
        hideWhenIdle: false
        animationEnabled: true
        idleFrequencySec: 20
        clickThrough: false
        startSleeping: false
        animationSpeed: 1
        # --- 气泡（实时思考过程 / 状态提示） ---
        bubbleEnabled: true
        bubbleMaxChars: 80
        bubbleSeconds: 6
        confirmBubbleText: '⚠ 需要你的确认'
        successBubbleText: '✓ 完成！'
        errorBubbleText: '✗ 出错了'
        # --- 音效（文件放在插件 assets/sounds/ 下，WAV 格式；留空不播放） ---
        soundSuccess: ''
        soundError: ''
        soundConfirm: ''
